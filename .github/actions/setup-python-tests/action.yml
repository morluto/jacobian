name: Set up Python tests
description: Install the requested Python and a locked dependency profile.
inputs:
  python-version:
    description: Python minor version to install and select.
    required: true
  dependency-profile:
    description: >
      Locked uv dependency profile. `dev`/`contributor` install the full
      contributor umbrella. `test-core` is the complete unit-lane import
      closure: unit tests exercise benchmark, release, and contributor tooling,
      so it intentionally resolves through the contributor group. The `lint`,
      `typecheck`, `security`, and `benchmark` profiles remain narrow.
    required: false
    default: "dev"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-suffix: ${{ inputs.dependency-profile }}
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Sync the frozen environment
      shell: bash
      env:
        UV_PYTHON: ${{ inputs.python-version }}
        DEPENDENCY_PROFILE: ${{ inputs.dependency-profile }}
      run: |
        set -euo pipefail
        case "${DEPENDENCY_PROFILE}" in
          dev|contributor)
            uv sync --locked --group "${DEPENDENCY_PROFILE}"
            ;;
          test-core)
            # The unit lane imports benchmark/release helpers that are themselves
            # contributor tools. Keep one honest, locked import closure rather
            # than allowing collection to depend on ambient packages.
            uv sync --locked --group contributor
            ;;
          lint|typecheck|security|benchmark)
            uv sync --locked --no-default-groups --group "${DEPENDENCY_PROFILE}"
            ;;
          *)
            echo "unknown dependency-profile: ${DEPENDENCY_PROFILE}" >&2
            exit 1
            ;;
        esac
    - name: Require the requested Python version
      shell: bash
      env:
        UV_PYTHON: ${{ inputs.python-version }}
      run: >-
        uv run --locked --no-sync python -c
        "import os, sys;
        expected = tuple(map(int, os.environ['UV_PYTHON'].split('.')));
        assert sys.version_info[:2] == expected,
        f'expected Python {expected}, got {sys.version_info[:2]}'"
