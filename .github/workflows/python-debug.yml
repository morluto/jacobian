name: Python Debug

on:
  workflow_dispatch:
    inputs:
      pytest-selector:
        description: One pytest file or node ID to run
        required: true
        default: tests/mcp/test_mcp_invocation_journey.py
        type: string
      keyword:
        description: Optional pytest -k expression
        required: false
        type: string
      python-version:
        description: Supported Python version
        required: true
        default: "3.12"
        type: choice
        options:
          - "3.12"
          - "3.13"

concurrency:
  group: python-debug-${{ github.ref }}-${{ inputs.pytest-selector }}-${{ inputs.python-version }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-debug:
    name: Focused Python reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run focused Python test
        env:
          TEST_SELECTOR: ${{ inputs.pytest-selector }}
          TEST_KEYWORD: ${{ inputs.keyword }}
        run: |
          args=(-n 0 "$TEST_SELECTOR" --durations=10)
          if [ -n "$TEST_KEYWORD" ]; then
            args+=(-k "$TEST_KEYWORD")
          fi
          uv run --locked pytest "${args[@]}"
