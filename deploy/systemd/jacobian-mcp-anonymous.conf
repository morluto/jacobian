# Explicit test-only override for jacobian-mcp.service.
# Replace the tenant ID. A Funnel makes this shared endpoint public; use only
# disposable non-sensitive state and remove the override after the test window.
[Service]
LoadCredential=
StateDirectory=
StateDirectory=jacobian-mcp-test
ExecStart=
ExecStart=/usr/bin/env /opt/jacobian/current/.venv/bin/jacobian-remote-mcp \
  --transport streamable-http \
  --host 127.0.0.1 \
  --port 8765 \
  --path /mcp \
  --stateless-http \
  --allow-anonymous \
  --anonymous-tenant-id replace-with-unique-test-id
