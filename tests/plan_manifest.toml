version = 1

# Authoritative test/CI plan manifest.
# Compile with: make compile-test-plan
# Projections: tests/topology.toml and .github/ci-impact.json (generated).

[[lanes]]
name = "unit"
kind = "pytest"
tier = "unit"
paths = ["tests/unit"]
command = "make test-unit"
workers = 0
distribution = "none"
timeout_seconds = 10
required_environment = []
required_provider = ""
timing_sharding = false
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "component"
kind = "pytest"
tier = "component"
paths = ["tests/component"]
command = "make test-component"
workers = 4
distribution = "worksteal"
timeout_seconds = 30
required_environment = []
required_provider = ""
timing_sharding = false
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }
matrix = true

[[lanes]]
name = "domain"
kind = "pytest"
tier = "domain"
paths = ["tests/domain"]
command = "make test-domain"
workers = 4
distribution = "worksteal"
timeout_seconds = 120
required_environment = []
required_provider = ""
timing_sharding = true
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "composition"
kind = "pytest"
tier = "composition"
paths = ["tests/composition"]
command = "make test-composition"
workers = 2
distribution = "worksteal"
timeout_seconds = 120
required_environment = []
required_provider = ""
timing_sharding = true
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "storage"
kind = "pytest"
tier = "boundary"
paths = ["tests/boundary/storage"]
command = "make test-storage"
workers = 0
distribution = "none"
timeout_seconds = 120
required_environment = ["sqlite"]
required_provider = ""
timing_sharding = false
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }
matrix = true

[[lanes]]
name = "process"
kind = "pytest"
tier = "boundary"
paths = ["tests/boundary/process"]
command = "make test-process"
workers = 2
distribution = "worksteal"
timeout_seconds = 120
required_environment = ["process-group"]
required_provider = ""
timing_sharding = false
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "mcp"
kind = "pytest"
tier = "boundary"
paths = ["tests/boundary/mcp"]
command = "make test-mcp"
workers = 2
distribution = "worksteal"
timeout_seconds = 120
required_environment = ["mcp"]
required_provider = ""
timing_sharding = false
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }
matrix = true

[[lanes]]
name = "provider"
kind = "pytest"
tier = "boundary"
paths = ["tests/boundary/providers/cvc5", "tests/boundary/providers/external_sat", "tests/boundary/providers/flint", "tests/boundary/providers/graph", "tests/boundary/providers/sympy"]
command = "make test-provider"
workers = 1
distribution = "load"
timeout_seconds = 180
required_environment = ["provider-readiness"]
required_provider = "optional"
timing_sharding = false
ci = { pull_request = false, merge_queue = true, main = true, scheduled = true }
matrix = true
providers = ["cvc5", "external_sat", "flint", "graph", "sympy"]

[[lanes]]
name = "lean"
kind = "pytest"
tier = "boundary"
paths = ["tests/boundary/providers/lean"]
command = "make test-lean"
workers = 0
distribution = "none"
timeout_seconds = 300
required_environment = ["lean-4.31.0", "mathlib"]
required_provider = "lean"
timing_sharding = false
ci = { pull_request = false, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "e2e"
kind = "pytest"
tier = "e2e"
paths = ["tests/e2e"]
command = "make test-e2e"
workers = 0
distribution = "none"
timeout_seconds = 180
required_environment = []
required_provider = ""
timing_sharding = false
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }
matrix = true

[[lanes]]
name = "npm"
kind = "gate"
command = "make npm-test"
topology_lane = false
local_gate = true
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "static"
kind = "gate"
command = "make check-static"
topology_lane = false
local_gate = true
local_subsumes = ["build"]
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "build"
kind = "gate"
command = "make build"
topology_lane = false
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "security"
kind = "gate"
command = "make security-audit"
topology_lane = false
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "duplicate"
kind = "gate"
command = "make duplicate-code"
topology_lane = false
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "docs"
kind = "gate"
command = "make docs-linkcheck"
topology_lane = false
local_gate = true
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

[[lanes]]
name = "deploy"
kind = "deploy"
command = "make deploy-check"
topology_lane = false
local_only = true
ci = { pull_request = true, merge_queue = true, main = true, scheduled = true }

# Path-impact rules. Pytest lane directory ownership (`*-tests`) is derived
# from [[lanes]] paths by the compiler and must not be duplicated here.

[[impact_rules]]
name = "documentation"
patterns = ["docs/**", "*.md", ".github/ISSUE_TEMPLATE/**", ".github/CODEOWNERS"]
suites = ["docs"]

[[impact_rules]]
name = "deployment"
patterns = ["deploy/**"]
suites = ["process"]

[[impact_rules]]
name = "npm-package"
patterns = ["npm/**"]
suites = ["npm"]

[[impact_rules]]
name = "lean-runtime"
patterns = ["lean/**"]
suites = ["lean"]

[[impact_rules]]
name = "optional-provider-sources"
patterns = [
  "src/jacobian/provider_runtime.py",
  "src/jacobian/**/*provider*.py",
  "src/jacobian/cvc5*.py",
  "src/jacobian/flint*.py",
  "src/jacobian/**/*cvc5*.py",
  "src/jacobian/**/*flint*.py",
]
suites = ["provider"]

[[impact_rules]]
name = "verification-boundary"
patterns = [
  "src/jacobian/runtime/**",
  "src/jacobian/installation/**",
  "src/jacobian/portfolio/**",
  "src/jacobian/providers/**",
  "src/jacobian/artifacts.py",
  "src/jacobian/checker_artifacts.py",
  "src/jacobian/registry.py",
  "src/jacobian/schema_registry.py",
  "src/jacobian/plugins/registry.py",
]
suites = [
  "unit",
  "component",
  "domain",
  "composition",
  "storage",
  "process",
  "mcp",
  "e2e",
  "lean",
  "npm",
  "static",
  "build",
  "security",
  "duplicate",
]

[[impact_rules]]
name = "lean-python-adapter"
patterns = [
  "src/jacobian/lean*.py",
  "src/jacobian/**/*lean*.py",
  "src/jacobian_checkers/lean4.py",
]
suites = [
  "unit",
  "component",
  "domain",
  "composition",
  "storage",
  "process",
  "mcp",
  "e2e",
  "lean",
  "static",
  "build",
]

[[impact_rules]]
name = "lean-shared-contracts"
patterns = [
  "src/jacobian/contracts/capabilities.py",
  "src/jacobian/contracts/checkers.py",
  "src/jacobian/contracts/common.py",
  "src/jacobian/contracts/evidence.py",
  "src/jacobian/contracts/plugins.py",
  "src/jacobian/contracts/results.py",
  "src/jacobian/contracts/verification.py",
]
suites = ["lean"]

[[impact_rules]]
name = "npm-facing-adapter"
patterns = ["src/jacobian/adapters/mcp/**"]
suites = ["unit", "component", "mcp", "e2e", "npm", "static", "build"]
suppresses = ["python-source"]

[[impact_rules]]
name = "domain-mathematical-sources"
patterns = ["src/jacobian/domains/**"]
suites = ["unit", "component", "domain", "static", "build"]
suppresses = ["python-source"]

[[impact_rules]]
name = "python-source"
patterns = ["src/jacobian/**", "src/jacobian_checkers/**"]
suites = [
  "unit",
  "component",
  "domain",
  "composition",
  "storage",
  "process",
  "mcp",
  "e2e",
  "static",
  "build",
]

[[impact_rules]]
name = "ci-automation"
patterns = [".github/actions/**", ".github/workflows/**"]
suites = [
  "unit",
  "component",
  "domain",
  "composition",
  "storage",
  "process",
  "mcp",
  "e2e",
  "static",
