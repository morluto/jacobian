name: Autofix

# Same-repo PR branches get formatter fixes committed automatically, so a
# stale `ruff format` or an unused import never costs a CI round trip. Fork
# heads are read-only; there the existing static lane remains the signal.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: autofix-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    # Skip fork PRs (read-only token cannot push) and skip our own commits so
    # the pushed fix does not re-trigger this workflow.
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # `gh pr comment` posts an issue comment on the PR.
      pull-requests: write
      # The post-push `gh workflow run ci.yml` dispatch (see below) requires
      # actions: write because GITHUB_TOKEN pushes are event-suppressed.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          # A configured AUTOFIX_TOKEN must be the persisted push credential
          # itself: checkout stores it as http.<url>.extraheader, which takes
          # precedence over any token embedded in the remote URL.
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      # Mirror `make fix`: structural lint fixes first, formatting last — a
      # fixer can invalidate a previously formatted tree, never the reverse.
      - name: Apply safe lint fixes and format
        run: |
          uv run --locked ruff check --fix src tests benchmarks
          uv run --locked ruff format src tests benchmarks
      - name: Commit and push fixes
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Optional fine-grained PAT or app token. Pushes made with it raise
          # `pull_request synchronize` events normally; when unset we fall back
          # to GITHUB_TOKEN plus an explicit CI dispatch below.
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "jacobian-autofix[bot]"
          git config user.email "jacobian-autofix[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No fixes to apply"
            exit 0
          fi

          git add -u
          git commit -m "Apply lint autofixes

          Generated by the autofix workflow, see ${RUN_URL}"

          # Collaborators and agents push concurrently; rebase onto whatever
          # landed first and retry a bounded number of times. Giving up is
          # always safe: the next synchronize run retries, and the static
          # lane still fails closed on drift.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:${PR_HEAD_REF}" 2>/dev/null; then
              pushed=true
              break
            fi
            echo "push attempt ${attempt} failed; rebasing onto the remote head"
            git fetch origin "${PR_HEAD_REF}"
            if ! git rebase origin/"${PR_HEAD_REF}"; then
              echo "::warning::autofix could not rebase cleanly; leaving the branch untouched"
              exit 0
            fi
          done
          if [[ "${pushed}" != true ]]; then
            echo "::warning::autofix gave up after repeated non-fast-forward pushes"
            exit 0
          fi

          gh pr comment "$PR_NUMBER" \
            --body "Applied lint autofixes in ${RUN_URL}. Pull locally before pushing more commits."

          # GitHub suppresses workflow runs for pushes made with GITHUB_TOKEN,
          # so the new head would otherwise carry no fresh required checks and
          # stay unmergeable until a human pushes. Dispatch CI explicitly with
          # the pull_request lane selection (Lean skipped); its check runs
          # attach to this exact head SHA. With AUTOFIX_TOKEN configured the
          # push itself raises synchronize events, so no dispatch is needed.
          if [[ -z "${AUTOFIX_TOKEN}" ]]; then
            gh workflow run ci.yml --ref "$PR_HEAD_REF" -f pr_lanes=true
          fi
