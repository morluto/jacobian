[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jacobian"
version = "0.11.0"
description = "A capability-first MCP workbench for executable mathematics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jacobian contributors" }]
dependencies = [
    "filelock>=3.20,<4",
    "jsonschema>=4.23,<5",
    "mcp==2.0.0",
    "mcp-types==2.0.0",
    "networkx>=3.4,<4",
    "pydantic>=2.12,<3",
    "pydantic-core>=2.41,<3",
    "rfc8785==0.1.4",
    "sympy==1.14.0",
    "typer>=0.20,<1",
    "z3-solver>=4.15.4,<6",
]

[project.optional-dependencies]
flint = [
    "python-flint==0.9.0",
]
smt = [
    "cvc5==1.3.4",
]

[project.scripts]
jacobian = "jacobian.cli:app"
jacobian-mcp = "jacobian.adapters.mcp.cli:main"

[dependency-groups]
dev-core = [
    "deptry>=0.21,<1",
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<3",
    "pip-audit>=2.9,<3",
    "pre-commit>=4.4,<5",
    "pyperf>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-randomly==4.1.0",
    "pytest-repeat==0.9.4",
    "pytest-split==0.11.0",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.6,<4",
    "ruff==0.16.1",  # pinned to match .pre-commit-config.yaml rev
    "tomli-w==1.2.0",
    "types-jsonschema>=4.23,<5",
    "types-networkx>=3.4,<4",
    "vulture>=2.14,<3",
]
dev = [
    { include-group = "dev-core" },
    "cvc5==1.3.4",
    "python-flint==0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jacobian", "src/jacobian_checkers"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.diagnostics",
    "/.diagnostics/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
# Lane runners provide the deadline.  Thread mode avoids relying on a SIGALRM
# that native solver extensions may not observe; killable work is isolated in
# the process boundary lane.
timeout_method = "thread"
markers = [
    "requires_provider(name): test requires a production provider readiness probe",
    "performance: benchmark or timing evidence excluded from correctness lanes",
    "property: property-based invariant tests",
    "destructive_process: test requires child-process isolation and group termination",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PTH",
    "RUF",
    "SIM",
    "TD",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jacobian", "jacobian_checkers"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.deptry]
extend_exclude = ["benchmarks"]
known_first_party = ["jacobian", "jacobian_checkers"]
# Harbor is intentionally executed as a pinned external CLI through uvx; it is
# not part of Jacobian's runtime or locked application dependencies.
# The maintained deployment smoke configures the HTTP client bundled by the
# exactly pinned MCP transport; deploy/ is not part of the Python wheel.
# The Harbor manifest writer is repository tooling and uses the direct dev-only
# tomli-w dependency; it is intentionally absent from the runtime wheel.
per_rule_ignores = { "DEP001" = ["harbor"], "DEP002" = ["cvc5", "mcp-types", "python-flint"], "DEP003" = ["httpx2"], "DEP004" = ["tomli_w"] }

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["jacobian", "jacobian_checkers"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
