[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jacobian"
version = "0.11.0"
description = "Atomic mathematical tools for agents over MCP and Python"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jacobian contributors" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "cvc5==1.3.4",
    "filelock>=3.20,<4",
    "jsonschema>=4.23,<5",
    "mcp==2.0.0",
    "mcp-types==2.0.0",
    "networkx==3.6.1",
    "pydantic>=2.12,<3",
    "pydantic-core>=2.41,<3",
    "python-flint==0.9.0",
    "rfc8785==0.1.4",
    "sympy==1.14.0",
    "typer>=0.20,<1",
    "z3-solver==5.0.0.0",
]

[project.scripts]
jacobian = "jacobian.cli:app"
jacobian-mcp = "jacobian.adapters.mcp.cli:main"
jacobian-remote-mcp = "jacobian.adapters.mcp.remote_cli:main"

[dependency-groups]
dev-core = [
    "deptry>=0.21,<1",
    "hypothesis>=6.130,<7",
    "import-linter>=2,<3",
    "mypy>=1.15,<3",
    "pip-audit>=2.9,<3",
    "pre-commit>=4.4,<5",
    "pyperf>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-randomly==4.1.0",
    "pytest-repeat==0.9.4",
    "pytest-split==0.11.0",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.6,<4",
    "ruff==0.16.1",  # pinned to match .pre-commit-config.yaml rev
    "tomli-w==1.2.0",
    "types-jsonschema>=4.23,<5",
    "types-networkx>=3.4,<4",
    "vulture>=2.14,<3",
]
dev = [
    { include-group = "dev-core" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/jacobian", "src/jacobian_checkers"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.diagnostics",
    "/.diagnostics/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
# Default collection is Lean-free and xdist-safe. Storage, process, MCP, and
# Lean stay on explicit paths / Make targets because they need serial SQLite
# or kill-safe process supervision.
testpaths = [
    "tests/unit",
    "tests/component",
    "tests/domain",
    "tests/composition",
    "tests/boundary/providers/cvc5",
    "tests/boundary/providers/external_sat",
    "tests/boundary/providers/flint",
    "tests/e2e",
]
# Per-invocation --timeout lives on Make/CI commands, not here: a global
# deadline would interrupt native solvers that process/Lean isolate instead.
timeout_method = "thread"
markers = [
    "requires_provider(name): test requires a production provider readiness probe",
    "performance: benchmark or timing evidence excluded from correctness lanes",
    "property: property-based invariant tests",
    "destructive_process: test requires child-process isolation and group termination",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PTH",
    "RUF",
    "SIM",
    "TD",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jacobian", "jacobian_checkers"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.deptry]
extend_exclude = ["benchmarks"]
known_first_party = ["jacobian", "jacobian_checkers"]
# Harbor is intentionally executed as a pinned external CLI through uvx; it is
# not part of Jacobian's runtime or locked application dependencies.
# The maintained deployment smoke configures the HTTP client bundled by the
# exactly pinned MCP transport; deploy/ is not part of the Python wheel.
# The Harbor manifest writer is repository tooling and uses the direct dev-only
# tomli-w dependency; it is intentionally absent from the runtime wheel.
per_rule_ignores = { "DEP001" = ["harbor"], "DEP002" = ["cvc5", "python-flint"], "DEP003" = ["httpx2"], "DEP004" = ["tomli_w"] }

[tool.importlinter]
root_package = "jacobian"

[[tool.importlinter.contracts]]
name = "Passive contracts do not depend on product layers"
type = "forbidden"
source_modules = ["jacobian.contracts"]
forbidden_modules = [
    "jacobian.adapters",
    "jacobian.capability_service",
    "jacobian.domains",
    "jacobian.installation",
    "jacobian.math",
    "jacobian.operation_bindings",
    "jacobian.operation_installation",
    "jacobian.operation_publication",
    "jacobian.operation_runtime",
    "jacobian.operations",
    "jacobian.persistence",
    "jacobian.portfolio",
    "jacobian.providers",
    "jacobian.runtime",
    "jacobian.storage",
    "jacobian.verification",
]

[[tool.importlinter.contracts]]
name = "The public math library does not depend on product layers"
type = "forbidden"
source_modules = ["jacobian.math"]
forbidden_modules = [
    "jacobian.adapters",
    "jacobian.capability_service",
    "jacobian.checker_authorization",
    "jacobian.checker_operations",
    "jacobian.checker_worker",
    "jacobian.domains",
    "jacobian.installation",
    "jacobian.operation_bindings",
    "jacobian.operation_installation",
    "jacobian.operation_projection",
    "jacobian.operation_publication",
    "jacobian.operation_runtime",
    "jacobian.operations",
    "jacobian.persistence",
    "jacobian.portfolio",
    "jacobian.providers",
    "jacobian.runtime",
    "jacobian.storage",
    "jacobian.verification",
    "jacobian.value_references",
]

[[tool.importlinter.contracts]]
name = "Semantic operations do not depend on installed layers"
type = "forbidden"
source_modules = ["jacobian.operations"]
forbidden_modules = [
    "jacobian.adapters",
    "jacobian.checker_operations",
    "jacobian.installation",
    "jacobian.operation_bindings",
    "jacobian.operation_installation",
    "jacobian.operation_projection",
    "jacobian.operation_publication",
    "jacobian.operation_runtime",
    "jacobian.persistence",
    "jacobian.portfolio",
    "jacobian.runtime",
    "jacobian.storage",
    "jacobian.verification",
]

[[tool.importlinter.contracts]]
name = "Finite-field values do not import private backends"
type = "forbidden"
source_modules = ["jacobian.math.finite_fields.values"]
forbidden_modules = [
    "jacobian.math.finite_fields._flint",
    "jacobian.math.finite_fields._sympy",
]

[[tool.importlinter.contracts]]
name = "Persistence does not depend on storage or product layers"
type = "forbidden"
source_modules = ["jacobian.persistence"]
forbidden_modules = [
    "jacobian.adapters",
    "jacobian.domains",
    "jacobian.installation",
    "jacobian.operation_bindings",
    "jacobian.operation_installation",
    "jacobian.operation_publication",
    "jacobian.operation_runtime",
    "jacobian.portfolio",
    "jacobian.providers",
    "jacobian.runtime",
    "jacobian.storage",
    "jacobian.verification",
]

[[tool.importlinter.contracts]]
name = "Provider infrastructure does not depend on installed product layers"
type = "forbidden"
source_modules = ["jacobian.providers", "jacobian.provider_runtime"]
forbidden_modules = [
    "jacobian.adapters",
    "jacobian.domains",
    "jacobian.installation",
    "jacobian.math",
    "jacobian.operation_bindings",
    "jacobian.operation_installation",
    "jacobian.operation_projection",
    "jacobian.operation_publication",
    "jacobian.operation_runtime",
    "jacobian.operations",
    "jacobian.portfolio",
    "jacobian.runtime",
    "jacobian.storage",
    "jacobian.verification",
]

[[tool.importlinter.contracts]]
name = "Runtime service ownership does not depend on portfolio assembly"
type = "forbidden"
source_modules = [
    "jacobian.runtime.bootstrap",
    "jacobian.runtime.model",
    "jacobian.runtime.services",
]
forbidden_modules = ["jacobian.portfolio"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["jacobian", "jacobian_checkers"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
