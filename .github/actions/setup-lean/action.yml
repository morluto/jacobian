name: Prepare Lean check environment
description: Install the fixed Lean toolchain and Python dependencies for one-shot Lean checks.

inputs:
  timing-heading:
    description: Heading used in the GitHub step summary
    required: false
    default: Lean phase timing

runs:
  using: composite
  steps:
    - name: Start Lean setup timing
      shell: bash
      run: echo "LEAN_SETUP_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
    - name: Set up the fixed Lean toolchain
      uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
      with:
        lake-package-directory: lean
        auto-config: false
        use-mathlib-cache: false
        use-github-cache: false
        build: false
        test: false
        lint: false
    - name: Record Lean setup timing
      shell: bash
      env:
        TIMING_HEADING: ${{ inputs.timing-heading }}
      run: |
        duration=$(($(date +%s) - LEAN_SETUP_STARTED_AT))
        echo "LEAN_TOOLCHAIN_SETUP_SECONDS=$duration" >> "$GITHUB_ENV"
        {
          echo "## $TIMING_HEADING"
          echo ""
          echo "| Phase | Seconds |"
          echo "| --- | ---: |"
          echo "| Fixed Lean toolchain | $duration |"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Install Python dependencies
      shell: bash
      run: uv sync --locked --dev
    - name: Record Lean setup telemetry
      if: always()
      shell: bash
      run: |
        setup_seconds=${LEAN_TOOLCHAIN_SETUP_SECONDS:-0}
        {
          echo ""
          echo "## Lean toolchain"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Fixed toolchain setup seconds | $setup_seconds |"
        } >> "$GITHUB_STEP_SUMMARY"
