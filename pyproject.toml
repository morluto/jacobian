[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jacobian"
version = "0.12.0"
description = "Atomic mathematical tools for agents over MCP and Python"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jacobian contributors" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "mcp==2.0.0",
    "networkx==3.6.1",
    "pydantic>=2.12,<3",
    "python-flint==0.9.0",
    "rfc8785==0.1.4",
    "sympy==1.14.0",
    "typer>=0.20,<1",
    "z3-solver==5.0.0.0",
]

[project.scripts]
jacobian = "jacobian.cli:app"
jacobian-mcp = "jacobian.mcp.stdio_cli:main"
jacobian-remote-mcp = "jacobian.mcp.remote_cli:main"

[dependency-groups]
dev-core = [
    "deptry>=0.21,<1",
    "hypothesis>=6.130,<7",
    "import-linter>=2,<3",
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<3",
    "pip-audit>=2.9,<3",
    "pre-commit>=4.4,<5",
    "pyperf>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-randomly==4.1.0",
    "pytest-repeat==0.9.4",
    "pytest-split==0.11.0",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.6,<4",
    "ruff==0.16.3",  # pinned to match .pre-commit-config.yaml rev
    "tomli-w==1.2.0",
    "types-jsonschema>=4.23,<5",
    "types-networkx>=3.4,<4",
    "vulture>=2.14,<3",
]
dev = [
    { include-group = "dev-core" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/jacobian"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.diagnostics",
    "/.diagnostics/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
pythonpath = ["."]
# Default collection is Lean-free and xdist-safe. Process, MCP, and optional
# Lean checks stay on explicit paths / Make targets.
testpaths = [
    "tests/math",
    "tests/catalog",
    "tests/dispatch",
    "tests/cli",
    "tests/tooling",
    "tests/integration",
]
# Per-invocation --timeout lives on Make/CI commands, not here: a global
# deadline would interrupt native solvers that process/Lean isolate instead.
timeout_method = "thread"
markers = [
    "requires_provider(name): test requires a production provider readiness probe",
    "requires_lean: test requires the fixed external Lean toolchain",
    "property: property-based invariant tests",
    "exhaustive: broad finite reference sweeps run by scheduled validation",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PTH",
    "RUF",
    "SIM",
    "TD",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jacobian"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jacobian.math.graph_decomposition._operations"]
disable_error_code = ["type-arg", "arg-type", "misc", "comparison-overlap", "unused-ignore", "var-annotated"]

[tool.deptry]
extend_exclude = ["benchmarks"]
known_first_party = ["jacobian"]
# Harbor is intentionally executed as a pinned external CLI through uvx; it is
# not part of Jacobian's runtime or locked application dependencies.
# The maintained deployment smoke configures the HTTP client bundled by the
# exactly pinned MCP transport; deploy/ is not part of the Python wheel.
# The Harbor manifest writer is repository tooling and uses the direct dev-only
# tomli-w dependency; it is intentionally absent from the runtime wheel.
per_rule_ignores = { "DEP001" = ["harbor"], "DEP002" = ["python-flint"], "DEP003" = ["httpx2"], "DEP004" = ["jsonschema", "tomli_w"] }

[tool.importlinter]
root_package = "jacobian"

[[tool.importlinter.contracts]]
name = "The public math library does not depend on product layers"
type = "forbidden"
source_modules = [
    "jacobian.math.algebraic_combinatorics.operations",
    "jacobian.math.arithmetic.operations",
    "jacobian.math.boolean.operations",
    "jacobian.math.canonical_forms.operations",
    "jacobian.math.certified_snf.operations",
    "jacobian.math.certified_snf.values",
    "jacobian.math.code_theory.operations",
    "jacobian.math.combinatorics.recurrence_tables",
    "jacobian.math.finite_abelian_groups",
    "jacobian.math.finite_fields.operations",
    "jacobian.math.finite_fields.values",
    "jacobian.math.graph_spectral.operations",
    "jacobian.math.graphs.graph6",
    "jacobian.math.graphs.independence",
    "jacobian.math.graphs.operations",
    "jacobian.math.graphs.values",
    "jacobian.math.group.operations",
    "jacobian.math.lattices.operations",
    "jacobian.math.markov_chain.operations",
    "jacobian.math.matrices.operations",
    "jacobian.math.matrices.values",
    "jacobian.math.modular_polynomials",
    "jacobian.math.number_field.operations",
    "jacobian.math.polynomials.operations",
    "jacobian.math.polynomials.values",
    "jacobian.math.prime_field_linear_algebra",
    "jacobian.math.probability.mutual_information",
    "jacobian.math.probability.values",
    "jacobian.math.projective_geometry.values",
    "jacobian.math.real_quadratic",
    "jacobian.math.recurrence_solving.operations",
    "jacobian.math.regular_languages.operations",
    "jacobian.math.regular_languages.values",
    "jacobian.math.root_isolation.operations",
    "jacobian.math.symbolic_matrix.operations",
]
forbidden_modules = [
    "jacobian.catalog",
    "jacobian.cli",
    "jacobian.dispatch",
    "jacobian.mcp",
    "jacobian.process",
]

[[tool.importlinter.contracts]]
name = "Catalog does not depend on dispatch or delivery boundaries"
type = "forbidden"
source_modules = ["jacobian.catalog"]
forbidden_modules = ["jacobian.cli", "jacobian.dispatch", "jacobian.mcp"]

[[tool.importlinter.contracts]]
name = "Dispatch does not depend on delivery boundaries"
type = "forbidden"
source_modules = ["jacobian.dispatch"]
forbidden_modules = ["jacobian.cli", "jacobian.mcp"]

[[tool.importlinter.contracts]]
name = "Finite-field values do not import private backends"
type = "forbidden"
source_modules = ["jacobian.math.finite_fields.values"]
forbidden_modules = [
    "jacobian.math.finite_fields._flint",
    "jacobian.math.finite_fields._sympy",
]

[tool.coverage.run]
branch = true
source = ["jacobian"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
