repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: uv.lock

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: ["src", "tests", "--min-confidence=80", "--ignore-names", "patched_root"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: jacobian-pre-push
        name: Jacobian pre-push static checks
        # Keep the push hook below the interactive feedback budget. CI owns
        # the resource-heavy correctness lanes; running the complete unit loop
        # here caused routine pushes to take roughly a minute and encouraged
        # --no-verify bypasses.
        entry: make lint typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
