services:
  main:
    depends_on:
      jacobian:
        condition: service_healthy
  jacobian:
    image: ${JACOBIAN_IMAGE:-jacobian:local}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        mkdir -p /logs/jacobian
        exec uv run --no-sync jacobian-remote-mcp "$@" > /logs/jacobian/mcp.log 2>&1
      - jacobian-remote-mcp
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --allow-anonymous
      - --state-dir
      - /state
    volumes:
      - jacobian-state:/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  jacobian-state: {}
