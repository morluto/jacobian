schema_version = "1.4"
artifacts = ["/app/submission.json"]

[task]
name = "jacobian/<dataset>-<task-slug>"
version = "1.0.0"
description = "<Short task description>"
keywords = ["mathematics"]

[metadata]
evaluation_kind = "<workflow|public-reproduction|research-diagnostic|performance|provider-feasibility|example>"
domain = "mathematical-sciences"
field = "<field>"
answer_visibility = "hidden-at-runtime"
provenance_class = "<provenance class>"
fixture_digest = "sha256:<fixture digest>"
required_provider = "core"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"
