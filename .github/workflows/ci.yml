name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    # The autofix bot dispatches CI on the head SHA it just pushed (GITHUB_TOKEN
    # pushes raise no events). Selecting the pull_request lane set keeps the
    # dispatched run identical to what a human push would run.
    inputs:
      pr_lanes:
        description: Select the pull_request lane set instead of the main gate.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer PR commit supersedes stale evidence; the required aggregate must
  # still fail closed if cancellation reaches its dependencies.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: make lint-full
      - run: make typecheck
      - run: make architecture
      - run: make repository-hygiene
      - run: make todo-check
      - run: make import-contracts
      - run: make docs-linkcheck
      - run: make npm-test
      - run: make build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  plan:
    name: plan test evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_lanes: ${{ steps.plan.outputs.pr_lanes }}
      run_math: ${{ steps.plan.outputs.run_math }}
      math_tests: ${{ steps.plan.outputs.math_tests }}
      math_shards: ${{ steps.plan.outputs.math_shards }}
      math_shard_count: ${{ steps.plan.outputs.math_shard_count }}
      run_catalog: ${{ steps.plan.outputs.run_catalog }}
      run_catalog_examples: ${{ steps.plan.outputs.run_catalog_examples }}
      run_scale: ${{ steps.plan.outputs.run_scale }}
      run_python: ${{ steps.plan.outputs.run_python }}
      python_lanes: ${{ steps.plan.outputs.python_lanes }}
      run_boundaries: ${{ steps.plan.outputs.run_boundaries }}
      boundary_lanes: ${{ steps.plan.outputs.boundary_lanes }}
      run_singular: ${{ steps.plan.outputs.run_singular }}
      run_wheel: ${{ steps.plan.outputs.run_wheel }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LANES: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_lanes) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          event="$EVENT_NAME"
          if [ "$PR_LANES" = true ]; then
            event=pull_request
          fi
          if [ "$event" = pull_request ] && [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            # A manually dispatched PR-lane run has no pull-request base SHA.
            # Preserve evidence by using the planner's full-suite event policy.
            event=workflow_dispatch
          fi
          if [ "$event" = pull_request ] || [ "$event" = merge_group ]; then
            git diff --no-ext-diff --no-textconv --name-only "$BASE_SHA...$HEAD_SHA" > changed-paths.txt
          else
            : > changed-paths.txt
          fi
          python tools/ci_test_plan.py \
            --event "$event" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --changed-paths changed-paths.txt \
            --github-output "$GITHUB_OUTPUT"
          echo "pr_lanes=$PR_LANES" >> "$GITHUB_OUTPUT"
      - name: Prepare math timing history
        if: steps.plan.outputs.math_shard_count == '4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/manage-test-timings prepare \
            --suite math \
            --output .ci/math-test-durations.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.math_shard_count == '4'
        with:
          name: math-test-durations-input
          path: .ci/math-test-durations.json
          include-hidden-files: true
          retention-days: 1

  math:
    name: python (math ${{ matrix.group }}/${{ matrix.splits }})
    needs: plan
    if: ${{ needs.plan.outputs.run_math == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.math_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - name: Download math timing history
        if: matrix.splits == 4
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: math-test-durations-input
          path: .ci
      - uses: ./.github/actions/run-test-lane
        with:
          lane: math
          junit-artifact: junit-python-math-3.12-${{ matrix.group }}
          coverage-artifact: coverage-data-python-math-${{ matrix.group }}
          coverage-file: .coverage.python-math-${{ matrix.group }}
          tests: ${{ needs.plan.outputs.math_tests }}
          collect-coverage: ${{ needs.plan.outputs.pr_lanes != 'true' }}
          split-count: ${{ matrix.splits }}
          split-group: ${{ matrix.group }}
          durations-path: .ci/math-test-durations.json
          store-durations: ${{ matrix.splits == 4 }}
          duration-output: math-test-durations.json
          duration-artifact: math-duration-shard-${{ matrix.group }}

  math_timings:
    name: Publish math timing history
    needs: [plan, math]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.pr_lanes != 'true' &&
      needs.plan.outputs.math_shard_count == '4' && needs.math.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: math-duration-shard-*
          path: .ci/math-shards
      - name: Merge math timing history
        run: |
          .github/scripts/manage-test-timings merge \
            --suite math \
            --input .ci/math-shards/math-duration-shard-1/math-test-durations.json \
            --input .ci/math-shards/math-duration-shard-2/math-test-durations.json \
            --input .ci/math-shards/math-duration-shard-3/math-test-durations.json \
            --input .ci/math-shards/math-duration-shard-4/math-test-durations.json \
            --output .ci/math-test-durations.json \
            --source-sha "${{ github.sha }}" \
            --python-version 3.12
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: math-test-durations
          path: .ci/math-test-durations.json
          include-hidden-files: true
          retention-days: 90

  scale:
    name: python (scale)
    needs: plan
    if: ${{ needs.plan.outputs.run_scale == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - uses: ./.github/actions/run-test-lane
        with:
          lane: scale
          junit-artifact: junit-python-scale-3.12
          coverage-artifact: coverage-data-python-scale
          coverage-file: .coverage.python-scale
          collect-coverage: "false"
        env:
          SCALE_WORKERS: "4"

  catalog:
    name: python (catalog)
    needs: plan
    if: ${{ needs.plan.outputs.run_catalog == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - uses: ./.github/actions/run-test-lane
        with:
          lane: catalog
          junit-artifact: junit-python-catalog-3.12
          coverage-artifact: coverage-data-python-catalog
          coverage-file: .coverage.python-catalog
          collect-coverage: ${{ needs.plan.outputs.pr_lanes != 'true' }}

  catalog_examples:
    name: python (catalog examples)
    needs: plan
    if: ${{ needs.plan.outputs.run_catalog_examples == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - uses: ./.github/actions/run-test-lane
        with:
          lane: integration
          junit-artifact: junit-python-catalog-examples-3.12
          coverage-artifact: coverage-data-python-catalog-examples
          coverage-file: .coverage.python-catalog-examples
          tests: tests/integration/catalog/
          collect-coverage: ${{ needs.plan.outputs.pr_lanes != 'true' }}

  python:
    name: python (${{ matrix.lane }})
    needs: plan
    if: ${{ needs.plan.outputs.run_python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.python_lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - uses: ./.github/actions/run-test-lane
        with:
          lane: ${{ matrix.lane }}
          junit-artifact: junit-python-${{ matrix.lane }}-3.12
          coverage-artifact: coverage-data-python-${{ matrix.lane }}
          coverage-file: .coverage.python-${{ matrix.lane }}
          collect-coverage: ${{ needs.plan.outputs.pr_lanes != 'true' }}

  boundaries:
    name: boundaries (${{ matrix.lane }})
    needs: plan
    if: ${{ needs.plan.outputs.run_boundaries == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.boundary_lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - uses: ./.github/actions/run-test-lane
        with:
          lane: ${{ matrix.lane }}
          junit-artifact: junit-${{ matrix.lane }}-3.12
          coverage-artifact: coverage-data-${{ matrix.lane }}
          coverage-file: .coverage.${{ matrix.lane }}
          collect-coverage: ${{ needs.plan.outputs.pr_lanes != 'true' }}

  singular:
    name: Exact Algebra Runtimes
    needs: plan
    if: ${{ needs.plan.outputs.run_singular == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/astral-sh/uv:0.11.28-python3.12-trixie-slim@sha256:3137a0b606f65a74ee0245f43dae219b09e8af98fc37fef20841cbceef35a646
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the fixed exact-algebra backends
        env:
          DEBIAN_FRONTEND: noninteractive
          SINGULAR_DEBIAN_VERSION: 1:4.4.1+ds-2
          QEPCAD_DEBIAN_VERSION: 1.74+ds-5
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make \
            "singular=${SINGULAR_DEBIAN_VERSION}" \
            "qepcad=${QEPCAD_DEBIAN_VERSION}"
          test "$(Singular -q --execute 'system("version");quit;' \
            | tr -d '[:space:]')" = "44100"
          qepcad -v | grep -F "Version B 1.74,"
      - run: uv sync --locked
      - run: make test-singular
      - run: make test-qepcad

  wheel:
    name: wheel (Python ${{ matrix.python-version }})
    needs: [plan, static]
    if: ${{ needs.plan.outputs.run_wheel == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install and start the built wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          environment="$RUNNER_TEMP/jacobian-wheel-${{ matrix.python-version }}"
          uv venv --python "${{ matrix.python-version }}" "$environment"
          uv pip install --python "$environment/bin/python" \
            --only-binary :all: "$wheel"
          "$environment/bin/jacobian" --help
          "$environment/bin/jacobian-mcp" --help
          "$environment/bin/jacobian" run integer.compute.extended_gcd \
            --json '{"left":"84","right":"30"}'
          "$environment/bin/python" deploy/smoke_stdio.py "$environment/bin/jacobian-mcp"
      - if: matrix.python-version == '3.13'
        uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.13"
      - if: matrix.python-version == '3.13'
        run: make test-compatibility
        env:
          PYTEST_ARGS: --junitxml=pytest.xml

  coverage:
    name: Coverage
    if: ${{ always() && needs.plan.outputs.pr_lanes != 'true' }}
    needs: [plan, math, catalog, catalog_examples, python, boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require selected final-tree test lanes
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MATH_RESULT: ${{ needs.math.result }}
          CATALOG_RESULT: ${{ needs.catalog.result }}
          CATALOG_EXAMPLES_RESULT: ${{ needs.catalog_examples.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          BOUNDARIES_RESULT: ${{ needs.boundaries.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$MATH_RESULT" = success
          test "$CATALOG_RESULT" = success
          test "$CATALOG_EXAMPLES_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$BOUNDARIES_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - run: uv run --locked coverage combine coverage-data
      - run: uv run --locked coverage report --fail-under=50 | tee coverage-report.txt
        shell: bash -o pipefail {0}
      - run: uv run --locked coverage xml
      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage Report"
            echo ""
            echo '```'
            cat coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-3.12
          path: coverage.xml

  required:
    name: required
    if: ${{ always() }}
    needs: [plan, static, math, scale, catalog, catalog_examples, python, boundaries, singular, wheel, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected evidence and final-tree specialist lanes
        env:
          PR_LANE_SELECTION: ${{ needs.plan.outputs.pr_lanes }}
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_MATH: ${{ needs.plan.outputs.run_math }}
          RUN_CATALOG: ${{ needs.plan.outputs.run_catalog }}
          RUN_CATALOG_EXAMPLES: ${{ needs.plan.outputs.run_catalog_examples }}
          RUN_SCALE: ${{ needs.plan.outputs.run_scale }}
          RUN_PYTHON: ${{ needs.plan.outputs.run_python }}
          RUN_BOUNDARIES: ${{ needs.plan.outputs.run_boundaries }}
          RUN_SINGULAR: ${{ needs.plan.outputs.run_singular }}
          RUN_WHEEL: ${{ needs.plan.outputs.run_wheel }}
          STATIC_RESULT: ${{ needs.static.result }}
          MATH_RESULT: ${{ needs.math.result }}
          SCALE_RESULT: ${{ needs.scale.result }}
          CATALOG_RESULT: ${{ needs.catalog.result }}
          CATALOG_EXAMPLES_RESULT: ${{ needs.catalog_examples.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          BOUNDARIES_RESULT: ${{ needs.boundaries.result }}
          SINGULAR_RESULT: ${{ needs.singular.result }}
          WHEEL_RESULT: ${{ needs.wheel.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          selected_result() {
            case "$1:$2" in
              true:success|false:skipped) ;;
              *) echo "selected=$1 result=$2" >&2; exit 1 ;;
            esac
          }
          test "$PLAN_RESULT" = success
          test "$STATIC_RESULT" = success
          selected_result "$RUN_MATH" "$MATH_RESULT"
          selected_result "$RUN_SCALE" "$SCALE_RESULT"
          selected_result "$RUN_CATALOG" "$CATALOG_RESULT"
          selected_result "$RUN_CATALOG_EXAMPLES" "$CATALOG_EXAMPLES_RESULT"
          selected_result "$RUN_PYTHON" "$PYTHON_RESULT"
          selected_result "$RUN_BOUNDARIES" "$BOUNDARIES_RESULT"
          selected_result "$RUN_SINGULAR" "$SINGULAR_RESULT"
          selected_result "$RUN_WHEEL" "$WHEEL_RESULT"
          if [ "$PR_LANE_SELECTION" = true ]; then
            test "$COVERAGE_RESULT" = skipped
          else
            test "$COVERAGE_RESULT" = success
          fi
