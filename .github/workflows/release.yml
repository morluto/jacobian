name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string

concurrency:
  group: release-publishing
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          test -n "$RELEASE_TAG"
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify release commit
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Require successful CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          green="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.RELEASE_SHA and .conclusion == "success")] | length')"
          if [ "$green" -gt 0 ]; then
            exit 0
          fi
          # A release can only publish from a commit whose CI is green.  The
          # common cause is a flaky ordinary lane that failed after the release
          # commit landed; surface the exact recovery instead of stranding the
          # release with an opaque exit code.  Re-running the failed CI for this
          # SHA (it is immutable) is the supported repair.
          {
            echo "::error title=Release commit is not green::CI has no successful run for release commit $RELEASE_SHA."
            echo "::error ::Re-run CI for $RELEASE_SHA, then re-dispatch this workflow with tag=${{ inputs.tag || github.event.release.tag_name }}."
          }
          exit 1
      - name: Build Python distributions
        run: uv build --out-dir dist/python
      - name: Test and pack npm distribution
        run: |
          npm test
          mkdir -p ../dist/npm
          npm pack --pack-destination ../dist/npm
        working-directory: npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: artifacts/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: artifacts/python/
          skip-existing: true

  publish-npm:
    name: Publish to npm
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: artifacts/
      - name: Publish npm distribution
        run: |
          version="$(node -p "require('./npm/package.json').version")"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
              echo "unsupported prerelease version for the alpha channel: $version" >&2
              exit 1
            fi
            dist_tag=alpha
          fi
          if dist_tags="$(npm view jacobian dist-tags --json 2>&1)"; then
            :
          elif [[ "$dist_tags" == *E404* || "$dist_tags" == *"404 Not Found"* ]]; then
            dist_tags='{}'
          else
            echo "$dist_tags" >&2
            exit 1
          fi
          current_tag="$(node - "$dist_tags" "$dist_tag" <<'NODE'
          const [encoded, tag] = process.argv.slice(2);
          const tags = JSON.parse(encoded);
          process.stdout.write(tags[tag] ?? "");
          NODE
          )"
          if [[ -n "$current_tag" ]] && ! node - "$version" "$current_tag" <<'NODE'
          const [candidate, current] = process.argv.slice(2);
          const pattern = /^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$/;
          const ranks = { alpha: 0, beta: 1, rc: 2 };

          function parse(version) {
            const match = pattern.exec(version);
            if (!match) throw new Error(`unsupported npm version: ${version}`);
            return {
              core: match.slice(1, 4).map(Number),
              prerelease: match[4]
                ? [ranks[match[4]], Number(match[5])]
                : null,
            };
          }

          function compare(left, right) {
            for (let index = 0; index < left.core.length; index += 1) {
              if (left.core[index] !== right.core[index]) {
                return left.core[index] - right.core[index];
              }
            }
            if (left.prerelease === null) return right.prerelease === null ? 0 : 1;
            if (right.prerelease === null) return -1;
            return left.prerelease[0] - right.prerelease[0] ||
              left.prerelease[1] - right.prerelease[1];
          }

          process.exit(compare(parse(candidate), parse(current)) >= 0 ? 0 : 1);
          NODE
          then
            echo "refusing to publish $version: $dist_tag already points to newer version $current_tag" >&2
            exit 1
          fi
          if npm view "jacobian@$version" version >/dev/null 2>&1; then
            echo "jacobian@$version is already published"
          else
            npm publish artifacts/npm/*.tgz --access public --tag "$dist_tag"
          fi

  publish-mcp:
    name: Publish to MCP Registry
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.release_sha }}
          persist-credentials: false
      - name: Verify immutable release commit
        env:
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Wait for the npm distribution to become visible
        # The MCP Registry validates that the referenced npm package version
        # exists. npm publish can return before that version is served by the
        # registry CDN, so wait for it instead of racing it. Without this wait
        # every release failed registry validation with a 404 (v0.15.1 through
        # v0.22.0) and only recovered after a manual re-dispatch.
        run: |
          version="$(node -p "require('./npm/package.json').version")"
          echo "Waiting for jacobian@${version} to appear on the npm registry"
          deadline=$(( SECONDS + 480 ))
          until curl -fsS "https://registry.npmjs.org/jacobian/${version}" >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "::error title=npm distribution unavailable::jacobian@${version} was not visible on the npm registry within 8 minutes."
              exit 1
            fi
            sleep 15
          done
          echo "jacobian@${version} is available on the npm registry"
      - name: Install MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
        run: |
          case "$(uname -m)" in
            x86_64)
              architecture=amd64
              checksum=1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
              ;;
            aarch64|arm64)
              architecture=arm64
              checksum=c978982c60e1b4903a976de090f04dc4fac4a320daa50704fcad2dbc93433d62
              ;;
            *)
              echo "unsupported MCP Publisher architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="mcp-publisher_linux_${architecture}.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "$checksum  $archive" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          chmod +x mcp-publisher
      - name: Validate server metadata
        run: ./mcp-publisher validate
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server metadata
        # The registry can remain briefly inconsistent after the npm version
        # becomes visible, so retry the publish with backoff.
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if ./mcp-publisher publish; then
              exit 0
            fi
            if (( attempt == attempts )); then
              echo "::error title=MCP Registry publish failed::mcp-publisher publish failed after ${attempts} attempts."
              exit 1
            fi
            delay=$(( attempt * 20 ))
            echo "Publish attempt ${attempt} failed; retrying in ${delay}s"
            sleep "$delay"
          done
